services:
  - type: web
    name: mtti-feedback-system
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn feedback.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "mtti-ict-feedback-sytem.onrender.com,localhost,127.0.0.1"
      - key: SECRET_KEY
        generateValue: true
